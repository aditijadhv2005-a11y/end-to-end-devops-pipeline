name: NGINX container CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define image name and build ID
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "BUILD_ID=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build local test image
        run: docker build --build-arg "BUILD_ID=${BUILD_ID}" -t "${IMAGE_NAME}:ci-${BUILD_ID}" .

      - name: Run HTTP smoke test
        env:
          EXPECTED_BUILD_ID: ${{ github.sha }}
          HOST_PORT: "18080"
        run: IMAGE_NAME="${IMAGE_NAME}:ci-${BUILD_ID}" ./scripts/test.sh

      - name: Validate Nomad job syntax
        uses: hashicorp/setup-nomad@v1
        with:
          version: "1.10.4"
      - name: Validate Nomad job
        run: nomad job validate -var "image=${IMAGE_NAME}:ci-${BUILD_ID}" nomad/nginx.nomad.hcl

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image to GHCR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          docker tag "${IMAGE_NAME}:ci-${BUILD_ID}" "${IMAGE_NAME}:sha-${BUILD_ID}"
          docker push "${IMAGE_NAME}:sha-${BUILD_ID}"
