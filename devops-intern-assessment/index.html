<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DevOps Intern Final Assessment NGINX application">
  <title>DevOps Intern Assessment</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #172033; }
    main { width: min(90vw, 680px); padding: 2.5rem; border-radius: 1.25rem; background: #fff; box-shadow: 0 18px 55px #17203318; }
    .eyebrow { color: #3457d5; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; }
    h1 { margin-bottom: .4rem; font-size: clamp(2rem, 6vw, 3.2rem); }
    p { line-height: 1.65; }
    dl { display: grid; grid-template-columns: minmax(9rem, 1fr) 2fr; gap: .85rem 1rem; margin-top: 2rem; }
    dt { color: #5a6478; } dd { margin: 0; font-weight: 650; overflow-wrap: anywhere; }
    code { background: #eef1f8; padding: .2rem .45rem; border-radius: .35rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Containerized NGINX application</div>
    <h1>DevOps Intern Assessment</h1>

    <dl>
      <dt>Candidate</dt><dd>Aditi Jadhav</dd>
      <dt>Assessment date</dt><dd>20 October 2026</dd>
      <dt>Build identifier</dt><dd><code>__BUILD_ID__</code></dd>
    </dl>
  </main>
